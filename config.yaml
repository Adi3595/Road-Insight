# Road Recorder Configuration
# Production settings for Raspberry Pi 4 Model B continuous dashcam recording
# Road Inspection Industry Project (PMC Pune Demonstration)

camera:
  # Capture backend: 'auto', 'rpicam-vid', 'libcamera-vid', 'picamera2', or 'mock' (testing)
  backend: "auto"
  width: 1280
  height: 720
  fps: 30
  codec: "h264"
  # Target bitrate in bits per second (5000000 = ~5 Mbps)
  bitrate: 5000000
  # Show preview window on attached display (set to false for headless recording)
  preview: false

storage:
  # Primary mount path for the dedicated USB pendrive
  mount_path: "/mnt/road-recorder-usb"
  recordings_directory: "recordings"
  metadata_directory: "metadata"
  logs_directory: "logs"
  diagnostics_directory: "diagnostics"
  
  # Strictly require verified USB mount before allowing recording
  require_verified_usb: true
  
  # Strictly disallow fallback to microSD card
  allow_fallback_to_sd: false
  
  # Expected USB volume UUID for PMC Pune Road Recorder pendrive
  volume_uuid: "70AA-2D80"
  
  # Storage capacity safeguards
  low_space_warning_percent: 15
  critical_free_space_mb: 1024

recording:
  # Duration of each video segment in seconds (default: 300s / 5 minutes)
  segment_duration_seconds: 300
  # Output container format: 'mp4' or 'h264'
  container_format: "mp4"
  # Automatically start recording when application is launched (keep false)
  auto_start: false

api:
  # API server host and port
  host: "0.0.0.0"
  port: 8000
  # Environment variable name holding the master API Key
  api_key_env_var: "ROAD_RECORDER_API_KEY"
  # Secure path to persistent API key file stored on the verified USB drive
  api_key_file: "/mnt/road-recorder-usb/.road-recorder-api.key"
  # Maximum allowable recording duration for a single requested session (seconds)
  max_duration_seconds: 3600
  # Enable CORS for frontend consumers
  cors_origins:
    - "*"
